components:
  schemas:
    Article:
      type: object
      properties:
        slug:
          type: string
          title: URL
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
        en:
          type: string
        category:
          type: string
          title: Категория
          maxLength: 60
        body:
          type: array
          items:
            type: string
          readOnly: true
        bodyEn:
          type: array
          items:
            type: string
          readOnly: true
        time:
          type: string
          readOnly: true
        author:
          type: string
          title: Автор
          maxLength: 160
        cover:
          type: string
          format: uri
          nullable: true
          title: Обложка
        published_at:
          type: string
          format: date
          nullable: true
          title: Дата публикации
        seo_title:
          type: string
          maxLength: 200
        seo_description:
          type: string
          maxLength: 350
      required:
      - body
      - bodyEn
      - en
      - slug
      - time
      - title
    BudgetEnum:
      enum:
      - estimate
      - under-1000
      - 1000-3000
      - 3000-5000
      - 5000-10000
      - 10000-plus
      type: string
      description: |-
        * `estimate` - Нужна оценка
        * `under-1000` - до $1,000
        * `1000-3000` - $1,000–3,000
        * `3000-5000` - $3,000–5,000
        * `5000-10000` - $5,000–10,000
        * `10000-plus` - $10,000+
    ContactRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Имя
          maxLength: 120
        company:
          type: string
          title: Компания
          maxLength: 160
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        contact:
          type: string
          title: Телефон / Telegram
          maxLength: 150
        projectType:
          allOf:
          - $ref: '#/components/schemas/ProjectTypeEnum'
          default: Other
        description:
          type: string
          minLength: 10
          maxLength: 5000
        budget:
          allOf:
          - $ref: '#/components/schemas/BudgetEnum'
          title: Бюджет
        timeline:
          allOf:
          - $ref: '#/components/schemas/TimelineEnum'
          title: Срок
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          title: Язык
        consent:
          type: boolean
        referrer:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        utm_source:
          type: string
          maxLength: 250
        utm_medium:
          type: string
          maxLength: 250
        utm_campaign:
          type: string
          maxLength: 250
        utm_term:
          type: string
          maxLength: 250
        utm_content:
          type: string
          maxLength: 250
        attachment:
          type: string
          format: binary
          writeOnly: true
        website:
          type: string
          writeOnly: true
          maxLength: 200
        request_id:
          type: string
          format: uuid
          writeOnly: true
        message:
          type: string
          writeOnly: true
          minLength: 10
          maxLength: 5000
      required:
      - consent
      - email
      - name
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    IconEnum:
      enum:
      - design
      - web
      - mobile
      - crm
      type: string
      description: |-
        * `design` - design
        * `web` - web
        * `mobile` - mobile
        * `crm` - crm
    Job:
      type: object
      properties:
        slug:
          type: string
          title: URL
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        title_ru:
          type: string
          title: Название RU
          maxLength: 200
        title_en:
          type: string
          title: Название EN
          maxLength: 200
        work_format:
          type: string
          title: Формат работы
          maxLength: 150
        description_ru:
          type: string
          title: Описание RU
        description_en:
          type: string
          title: Описание EN
        requirements_ru:
          type: string
          title: Требования RU
        requirements_en:
          type: string
          title: Требования EN
      required:
      - description_ru
      - slug
      - title_en
      - title_ru
    LeadReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
      required:
      - id
      - message
    LeadRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Имя
          maxLength: 120
        company:
          type: string
          title: Компания
          maxLength: 160
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        contact:
          type: string
          title: Телефон / Telegram
          maxLength: 150
        projectType:
          $ref: '#/components/schemas/ProjectTypeEnum'
        description:
          type: string
          minLength: 10
          maxLength: 5000
        budget:
          allOf:
          - $ref: '#/components/schemas/BudgetEnum'
          title: Бюджет
        timeline:
          allOf:
          - $ref: '#/components/schemas/TimelineEnum'
          title: Срок
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          title: Язык
        consent:
          type: boolean
        referrer:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        utm_source:
          type: string
          maxLength: 250
        utm_medium:
          type: string
          maxLength: 250
        utm_campaign:
          type: string
          maxLength: 250
        utm_term:
          type: string
          maxLength: 250
        utm_content:
          type: string
          maxLength: 250
        attachment:
          type: string
          format: binary
          writeOnly: true
        website:
          type: string
          writeOnly: true
          maxLength: 200
        request_id:
          type: string
          format: uuid
          writeOnly: true
      required:
      - consent
      - description
      - email
      - name
      - projectType
    LocaleEnum:
      enum:
      - ru
      - en
      type: string
      description: |-
        * `ru` - Русский
        * `en` - English
    PaginatedArticleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
